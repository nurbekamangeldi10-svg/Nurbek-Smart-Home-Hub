<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820">
<title>Ақылды үй хабы — 3D модель</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,sans-serif;color:#f4f5f3;background:radial-gradient(ellipse at 52% 44%,#293a45,#17232d 45%,#0b1118)}model-viewer{position:absolute;inset:0;width:100%;height:100%;--poster-color:transparent;--progress-bar-color:#75ddf4}.top{position:absolute;top:0;left:0;right:0;padding:38px 6vw;display:flex;justify-content:space-between;z-index:2;pointer-events:none}.brand{letter-spacing:.16em;font-size:12px}.status{font-size:11px;color:#b8c9ce;letter-spacing:.12em}.status:before{content:'●';color:#80e4c0;margin-right:8px}.copy{position:absolute;left:8vw;bottom:11vh;z-index:2;max-width:420px;pointer-events:none}.eyebrow{color:#75ddf4;text-transform:uppercase;letter-spacing:.2em;font-size:11px}h1{font-size:clamp(38px,6vw,68px);line-height:1;letter-spacing:-.05em;font-weight:520;margin:14px 0}.desc{color:#b6c0c7;line-height:1.65;max-width:340px;font-size:14px}.controls{position:absolute;right:6vw;bottom:8vh;z-index:3;display:flex;gap:10px}button{color:#edf4f6;background:#101a22d9;border:1px solid #ffffff44;border-radius:30px;padding:12px 17px;font:inherit;font-size:12px;cursor:pointer}button:hover{border-color:#75ddf4}.hint{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);font-size:10px;color:#92a0a9;letter-spacing:.1em;white-space:nowrap}@media(max-width:650px){.status,.hint{display:none}.copy{left:25px;right:25px;bottom:120px}.controls{left:25px;right:auto;bottom:50px}}
</style></head>
<body><model-viewer id="hub" src="model.glb" alt="Ақылды үй хабының 3D моделі" camera-controls auto-rotate rotation-per-second="18deg" shadow-intensity="1.2" exposure="1.05" environment-image="neutral" ar ar-modes="webxr scene-viewer quick-look"></model-viewer>
<header class="top"><div class="brand">⌂ &nbsp; HOME / INTELLIGENCE</div><div class="status">Үй жүйесі белсенді</div></header>
<section class="copy"><p class="eyebrow">Ақылды үй хабы · 01</p><h1>Үйіңізді<br>бір орталықтан.</h1><p class="desc">Дауыспен басқарылатын хаб: жарық, климат және қауіпсіздік — барлығы бір құрылғыда.</p></section>
<div class="controls"><button id="rotate">⏸ Айналдыруды тоқтату</button><button id="ar">⌖ Бөлмеде көру</button></div><div class="hint">Модельді айналдыру үшін сүйреңіз · Жақындату үшін дөңгелекті айналдырыңыз</div>
<script>const v=document.querySelector('#hub'),r=document.querySelector('#rotate');r.onclick=()=>{v.autoRotate=!v.autoRotate;r.textContent=v.autoRotate?'⏸ Айналдыруды тоқтату':'▶ Айналдыру'};document.querySelector('#ar').onclick=()=>v.canActivateAR?v.activateAR():alert('AR режимі бұл құрылғыда қолжетімсіз.');v.addEventListener('load',()=>{if(!v.canActivateAR)document.querySelector('#ar').hidden=true});</script>
</body></html>
